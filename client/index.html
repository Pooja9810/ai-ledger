<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledgerly</title>
    <meta
      name="description"
      content="A personal finance ledger you can talk to: type, say or photograph a purchase, import a bank CSV, and ask questions answered from your data. AI proposes, code checks every number."
    />

    <!-- Link previews (LinkedIn, Slack, iMessage…): a title, a sentence and
         a picture of the app instead of a bare link. Must be absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ledgerly" />
    <meta
      property="og:title"
      content="Ledgerly: a personal finance ledger you can talk to"
    />
    <meta
      property="og:description"
      content="Type, say or photograph a purchase; import a bank CSV; ask your ledger questions. The AI proposes, code computes every number. Live demo with made-up data."
    />
    <meta
      property="og:url"
      content="https://ledgerly-demo-gca0.onrender.com/"
    />
    <meta
      property="og:image"
      content="https://ledgerly-demo-gca0.onrender.com/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Ledgerly's Home screen: spending this month, a category donut, budgets that need a look"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Add to Home Screen: icon, name and full-screen launch on phones. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Ledgerly" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="theme-color"
      content="#f6f6f3"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0e0f12"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Apply the saved theme before the first paint, so a dark-mode
         visitor never sees a flash of light colors. (theme.js does the same
         after React starts; this copy only runs once, here.) -->
    <script>
      try {
        var saved = localStorage.getItem("ledgerly-theme");
        if (saved === "light" || saved === "dark")
          document.documentElement.setAttribute("data-theme", saved);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
